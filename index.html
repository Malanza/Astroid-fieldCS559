<!DOCTYPE html>
<html>

<head>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <h3>Group ID: 0001</h3>
  <div id="gameContainer" style="position: relative; display: inline-block;">
    <div id="div1"></div>
    <div id="game-over-screen" style="
    position: absolute;
    top: 0;
    left: 0;
    width: 500px; /* Match your canvas size */
    height: 500px; /* Match your canvas size */
    background-color: rgba(0, 0, 0, 0.85);
    color: white;
    display: none; /* Initially hidden */
    justify-content: center;
    align-items: center;
    flex-direction: column;
    z-index: 10;
">
      <h2>GAME OVER</h2>
      <p>Try again!</p>
      <button onclick="document.getElementById('resetBtn').click()">Play Again</button>
    </div>
    <script type="importmap">
      {
          "imports": {
              "three": "./libs/three.js"
          }
      }
  </script>
    <div id="gameUI">
      <div id="lives">Lives: 3</div>
      <div id="score">Score: 0</div>
      <div id="highScore">High Score: 0</div>
      <div id="timer">Time: 0:00</div>
      <div id="modeDisplay">Mode: Prototype</div>
      <button id="soundBtn">Sound: ON</button>
    </div>
    <div id="controls">
      <button id="startBtn">Start Game</button>
      <button id="stopBtn">Pause Game</button>
      <button id="resetBtn">Reset Game</button>
      <button id="modeBtn">Switch to Full Mode</button>
    </div>
    <div id="instructions">
      <h3>Controls</h3>
      <div class="control-item">
        <strong>WASD:</strong> Move spaceship
      </div>
      <div class="control-item">
        <strong>Spacebar:</strong> Shoot lasers
      </div>
      <div class="control-item">
        <strong>Goal:</strong> Destroy asteroids and avoid collisions!
      </div>
    </div>
  </div>
  <script src="main.js" type="module" defer></script>
</body>

</html>
